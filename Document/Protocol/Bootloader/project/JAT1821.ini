
FUNC void config(void)
{
    int delay;
    _WDWORD(0x4000E000, 0x00000000);        //flash to 0x10000000
    _WDWORD(0x4000E020, 0x00FFFF00);        //change to osc
    _WDWORD(0x4000E05C, 0x03002222);        //config pll out to 192MHz
    _WDWORD(0x4000E058, 0x0B400000);
    _WDWORD(0x4000E054, 0x03000F00);
    delay = 200;
    while(delay--);                         //delay
    _WDWORD(0x4000E020, 0x00FFFF02);        //change to pll0
}	

config();


